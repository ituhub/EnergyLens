version: "3.8"

services:
  # ─── PostgreSQL (local dev) ───
  db:
    image: postgres:15-alpine
    container_name: energylens-db
    environment:
      POSTGRES_DB: energylens
      POSTGRES_USER: energylens
      POSTGRES_PASSWORD: energylens_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energylens"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── EnergyLens App (optional — can also run locally) ───
  # app:
  #   build: .
  #   container_name: energylens-app
  #   env_file: .env
  #   ports:
  #     - "8501:8501"    # Streamlit
  #     - "8000:8000"    # FastAPI
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - ./data:/app/data

volumes:
  pgdata:
